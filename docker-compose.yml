# Full local stack: API + web, a bisect worker, Redis queue, Prometheus and Grafana.
#   docker compose up --build        then open http://localhost:8787 and http://localhost:3000
# The worker talks to the host's Docker daemon to start sandbox containers. Mounting the socket
# gives that container control of Docker, which is acceptable on a developer machine and is
# exactly why the Kubernetes deployment uses sandbox Jobs instead (docs/THREAT_MODEL.md).
services:
  api:
    build: { context: ., dockerfile: Dockerfile }
    ports: ["8787:8787"]
    environment:
      REDIS_URL: redis://redis:6379
      BISECT_JOBS_ENABLED: "true"
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes: ["api-data:/data"]
    depends_on: [redis]

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    environment:
      REDIS_URL: redis://redis:6379
      SANDBOX: docker
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      # Worktrees are created under TMPDIR and bind-mounted into sandboxes, so the path must be
      # identical inside this container and on the host.
      TMPDIR: /tmp/causalci
      CACHE_DIR: /tmp/causalci/cache
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/causalci:/tmp/causalci
    depends_on: [redis]
    deploy: { replicas: 2 }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes: ["./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./deploy/observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/causalci.yml:ro
      - ./deploy/observability/dashboard.json:/var/lib/grafana/dashboards/causalci.json:ro

volumes:
  api-data:
  redis-data:
