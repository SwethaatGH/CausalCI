{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "causalci.labels" . | nindent 4 }}
spec:
  selector:
    matchExpressions: [{ key: app.kubernetes.io/component, operator: In, values: [api, worker] }]
  podMetricsEndpoints:
    - { port: http, path: /metrics }
    - { port: metrics, path: /metrics }
{{- end }}
