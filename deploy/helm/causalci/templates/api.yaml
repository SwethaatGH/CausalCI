apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-api-data
  labels: {{- include "causalci.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: {{ .Values.api.storage }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "causalci.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy: { type: Recreate }   # the SQLite volume is ReadWriteOnce
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: {{- include "causalci.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.api.port }}"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: "{{ .Values.image.api }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.api.port }} }]
          env:
            - { name: PORT, value: "{{ .Values.api.port }}" }
            - { name: REDIS_URL, value: "{{ include "causalci.redisUrl" . }}" }
            - { name: PUBLIC_DEMO, value: "{{ .Values.api.publicDemo }}" }
            - { name: BISECT_JOBS_ENABLED, value: "{{ .Values.api.bisectJobsEnabled }}" }
            - { name: AI_PROVIDER, value: gemini }
          envFrom:
            - secretRef: { name: {{ .Values.api.secretName }}, optional: true }
          readinessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 20, failureThreshold: 3 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "causalci.restricted" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-api-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "causalci.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 80, targetPort: http }]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "causalci.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls: [{ hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Release.Name }}-tls }]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-api, port: { name: http } } }
{{- end }}
