# GitOps: Argo CD keeps the cluster in sync with the chart on main. Image tags are bumped by the
# release workflow committing to deploy/helm/causalci/values.yaml (or use Argo CD Image Updater).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: causalci
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SwethaatGH/CausalCI.git
    targetRevision: main
    path: deploy/helm/causalci
    helm:
      valuesObject:
        sandbox: { runtimeClassName: gvisor, createRuntimeClass: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: causalci
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
