# Render Blueprint: one free web service running the prebuilt image (API + built web app on one port).
# The image is built and published by .github/workflows/deploy.yml, because building the web app needs
# about 1 GB of memory and a free Render instance has 512 MB. Render only pulls and runs it.
# Free instances sleep when idle and have no persistent disk, so saved investigations reset on restart;
# the built-in demo needs neither GitHub nor Gemma and always works.
services:
  - type: web
    name: causalci
    runtime: image
    image:
      url: ghcr.io/swethaatgh/causalci-api:latest
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8787"
      - key: PUBLIC_DEMO
        value: "true"
      # Keeps the server's heap inside a free instance's 512 MB.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # No GEMINI_API_KEY: the demo uses its labeled PRERECORDED analysis.
      - key: AI_PROVIDER
        value: gemini
      # Imports read history from a local git clone (no rate limit). Optional: a read-only token
      # raises the API limit used for repository details from 60 to 5,000 requests/hour.
      - key: GITHUB_TOKEN
        sync: false
      # Optional: live Gemma for visitors' "Ask AI" (every request counts against your quota).
      - key: GEMINI_API_KEY
        sync: false
