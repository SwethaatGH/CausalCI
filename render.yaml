# Render Blueprint: one free web service running the Fastify API, which also serves the built web app.
# Free instances sleep when idle and have no persistent disk, so saved investigations reset on restart;
# the built-in demo needs neither GitHub nor Gemma and always works.
services:
  - type: web
    name: causalci
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # The heap cap applies only to the running server (free instances have 512 MB); the build needs more.
    startCommand: NODE_OPTIONS=--max-old-space-size=384 npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: WEB_DIST_PATH
        value: apps/web/dist
      - key: PUBLIC_DEMO
        value: "true"
      # No GEMINI_API_KEY: the demo uses its labeled PRERECORDED analysis.
      - key: AI_PROVIDER
        value: gemini
      # Imports read history from a local git clone (no rate limit). Optional: a read-only token
      # raises the API limit used for repository details from 60 to 5,000 requests/hour.
      - key: GITHUB_TOKEN
        sync: false
      # Optional: live Gemma for visitors' "Ask AI" (every request counts against your quota).
      - key: GEMINI_API_KEY
        sync: false
