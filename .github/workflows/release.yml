name: Release images

on:
  push: { tags: ["v*"] }

permissions:
  contents: read
  packages: write
  id-token: write      # keyless signing

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { name: causalci-api, file: Dockerfile }
          - { name: causalci-worker, file: Dockerfile.worker }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.ref_name }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
