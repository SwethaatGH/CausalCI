name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Regression gate on the search algorithms: the simulated accuracy table is part of the build.
      - name: Bisection benchmark
        run: npx tsx apps/cli/src/index.ts bench --trials 500 > bench.md && cat bench.md >> "$GITHUB_STEP_SUMMARY"

  images:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile, push: false, tags: causalci-api:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile.worker, push: false, tags: causalci-worker:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint and schema-validate rendered manifests
        run: |
          helm lint deploy/helm/causalci
          helm template causalci deploy/helm/causalci > rendered.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7 -strict -ignore-missing-schemas -summary /w/rendered.yaml
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform validate
        working-directory: deploy/terraform
        run: terraform init -backend=false && terraform fmt -check && terraform validate
